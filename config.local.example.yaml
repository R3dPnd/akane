# Machine-specific overrides — copy to config.local.yaml (gitignored) and
# uncomment what this machine needs. It's merged over config.yaml at load
# time: nested mappings merge key by key, but a list here REPLACES the whole
# list in config.yaml (so overriding mcp.servers means copying all of it).

# A bigger Mac can run a bigger router. Build it from a Modelfile that names
# a larger base (FROM qwen3:14b, say) under a new name:
# ollama:
#   model: akane-router-14b

# Larger Whisper models transcribe better and need more memory:
# stt:
#   model_size: medium        # or large-v3-turbo

# Specific mic/speaker (names or indices from `python -m sounddevice`):
# audio:
#   input_device: "MacBook Pro Microphone"
#   output_device: null

# pnd-notes cloned somewhere other than next to akane: each mcp server's
# `env:` mapping is passed to it, and pnd-notes reads PND_NOTES_DIR. Because
# lists replace, copy the whole mcp.servers list from config.yaml and add to
# the pnd_notes entry:
#       env:
#         PND_NOTES_DIR: /path/to/pnd-notes/notes

# Facts about you that Akane should always know. Personal, so they live here
# rather than in config.yaml. Location lets "near me" questions skip asking.
# user:
#   location: Tacoma, WA

# Overnight job hunt (`akane hunt`; see docs/user-guide.md). Personal, so it
# lives here. Kinds JSearch's job boards don't carry (AI code evaluation,
# code review, bounties) are found by a Claude web search instead.
# job_hunt:
#   pay_floor_hourly: 25
#   locations: [Remote, "Tacoma, WA", "Seattle, WA"]
#   kinds: [part-time SWE, AI code evaluation/training, freelance, code review, bounties]
#   schedule: >
#     Async first, in short bursts (waiting on AI, in transit). Early mornings best.
#     Mon-Thu commuting Tacoma->Seattle: no fixed daytime commitments those days.
#     Fridays flexible: in-person or scheduled work OK.
#   exclude: [fixed Mon-Thu daytime hours, on-call, in-office Mon-Thu, full-time]
#   max_leads: 8
#   max_queries: 6
#   run_at: "04:00"
